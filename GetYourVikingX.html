  <script>
  (function () {
    var form = document.querySelector('form[data-form-title="VikingX Consumer"]');
    if (!form) return;

    var alertSuccess = form.querySelector('[data-form-alert]');
    var alertDanger  = form.querySelector('[data-form-alert-danger]');
    var submitBtn    = form.querySelector('[type="submit"]');

    function updateSubmitState() {
      submitBtn.disabled = !form.checkValidity();
    }
    form.querySelectorAll('input, textarea, select').forEach(function (el) {
      el.addEventListener('input', updateSubmitState);
      el.addEventListener('change', updateSubmitState);
    });
    updateSubmitState();

    form.addEventListener('submit', function (event) {
      event.preventDefault();

      if (!form.checkValidity()) {
        form.reportValidity();
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Sending…';

      var fd = new FormData(form);
      fetch('https://script.google.com/macros/s/AKfycbzJpGpqIRPpEBmxys5INxFBab32OO3Bye5EgUy5iBeLE9zskd1hjGQMuKOmL6oE9Tsq/exec', {
        method: 'POST',
        body: JSON.stringify({
          sheet: 'Consumer',
          row: [
            new Date().toLocaleString(),
            fd.get('name') || '',
            fd.get('email') || '',
            fd.get('Phone') || '',
            fd.get('Country') || '',
            fd.get('City') || '',
            fd.get('How did you hear from us?') || '',
            fd.get('Message') || ''
          ]
        })
      })
      .then(function (res) { return res.json(); })
      .then(function (json) {
        if (!json.success) throw new Error(json.error || 'Error');
      })
      .then(function () {
        alertSuccess.removeAttribute('hidden');
        alertDanger.setAttribute('hidden', 'hidden');
        form.reset();
        updateSubmitState();
      })
      .catch(function () {
        alertDanger.removeAttribute('hidden');
        alertSuccess.setAttribute('hidden', 'hidden');
        updateSubmitState();
      })
      .finally(function () {
        submitBtn.innerHTML = '<span class="mobi-mbri mobi-mbri-letter mbr-iconfont mbr-iconfont-btn"></span> Ride with us';
      });
    });
  })();
  </script>
